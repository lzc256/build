name: Alpine

on:
  schedule:
    - cron: '56 18 * * *'  # Check once daily at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
  push:
    paths:
      - 'alpine/**'
      - '.github/workflows/alpine-build.yml'

env:
  REGISTRY: ghcr.io

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      alpine_digest: ${{ steps.digest.outputs.digest }}
      cache_key: ${{ steps.check.outputs.cache_key }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: .build

      - name: Get Alpine image digest
        id: digest
        run: |
          # Pull Alpine image manifest to get digest
          DIGEST=$(docker run --rm quay.io/skopeo/stable inspect docker://docker.io/library/alpine:latest --format='{{.Digest}}')
          if [ -z "$DIGEST" ]; then
            echo "Failed to get Alpine digest"
            exit 1
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Alpine digest: $DIGEST"

      - name: Check if build needed
        id: check
        uses: ./.build/.github/workflows/utils/check-update
        with:
          cache_key: alpine-${{ steps.digest.outputs.digest }}

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: .build

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .build/alpine
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:alpine
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Commit successful build
        if: success()
        uses: ./.build/.github/workflows/utils/commit-successful-update
        with:
          cache_key: ${{ needs.check-update.outputs.cache_key }}

      - name: Summary
        run: |
          echo "## Alpine Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Alpine Digest | \`${{ needs.check-update.outputs.alpine_digest }}\` |"
          echo "| Image | \`${{ env.REGISTRY }}/${{ github.repository }}:alpine\` |"
          echo "| Includes | python3, py3-pip, requests, fastapi, uvicorn, httpx, gradio_client, pydantic |"