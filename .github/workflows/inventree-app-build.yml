name: InvenTree App - Custom Build

on:
  schedule:
    - cron: '56 18 */2 * *'  # Check every 2 days at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream ref to build (branch/tag/commit, e.g. master, v1.0.0)'
        required: false
        type: string
  push:
    paths:
      - 'inventree-app/**'
      - '.github/workflows/inventree-app-build.yml'
      - 'scripts/common.sh'

env:
  UPSTREAM_REPO: inventree/inventree-app

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      cache_key: ${{ steps.check.outputs.cache_key }}
      commit_sha: ${{ steps.commit.outputs.sha }}
      commit_short: ${{ steps.commit.outputs.short }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Get latest upstream commit
        id: commit
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            REF="${{ github.event.inputs.ref }}"
          else
            REF="master"
          fi

          # Get the commit SHA for the ref
          SHA=$(curl -sfL "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/commits?sha=${REF}&per_page=1" \
            | jq -r '.[0].sha // empty')

          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "Failed to get upstream commit for ref: $REF"
            exit 1
          fi

          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "short=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Upstream commit: $SHA ($SHORT_SHA)"

      - name: Check if build needed
        id: check
        uses: ./.github/workflows/utils/check-update
        with:
          cache_key: inventree-app-v2-${{ steps.commit.outputs.sha }}-${{ github.sha }}

  build-android:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone inventree-app upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          path: inventree-app-src
          ref: ${{ needs.check-update.outputs.commit_sha }}

      - name: Setup signing
        id: signing
        working-directory: inventree-app-src/android
        run: |
          if [ -n "${{ secrets.INVENTREE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.INVENTREE_KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks
            cat > key.properties << EOF
          storePassword=${{ secrets.INVENTREE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.INVENTREE_KEY_PASSWORD }}
          keyAlias=${{ secrets.INVENTREE_KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✓ Release signing configured"
          else
            echo "::warning::No signing keystore configured. Using debug signing. Set INVENTREE_KEYSTORE_* secrets for release signing."
            source $GITHUB_WORKSPACE/scripts/common.sh
            apply_patch debug-signing inventree-app-src
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Configure Flutter
        working-directory: inventree-app-src
        run: |
          fvm use

      - name: Collect translations
        working-directory: inventree-app-src
        run: |
          cd lib/l10n
          python3 collect_translations.py

      - name: Get dependencies
        working-directory: inventree-app-src
        run: fvm flutter pub get

      - name: Build Android APK
        working-directory: inventree-app-src
        run: |
          fvm flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventree-app-${{ needs.check-update.outputs.commit_short }}
          path: inventree-app-src/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## InvenTree App Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Upstream Commit | \`${{ needs.check-update.outputs.commit_sha }}\` |"
          echo "| APK Artifact | \`inventree-app-${{ needs.check-update.outputs.commit_short }}\` |"

      - name: Commit successful build
        if: success()
        uses: ./.github/workflows/utils/commit-successful-update
        with:
          cache_key: ${{ needs.check-update.outputs.cache_key }}
