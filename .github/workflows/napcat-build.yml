name: NapCat

on:
  schedule:
    - cron: '56 18 * * *'  # Check once daily at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
  push:
    paths:
      - 'napcat/**'
      - '.github/workflows/napcat-build.yml'

env:
  REGISTRY: ghcr.io

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get NapCat version
        id: version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/NapNeko/NapCatQQ/releases/latest | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache check
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: .build_success
          key: napcat-${{ steps.version.outputs.version }}

      - name: Compare
        id: compare
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ -f .build_success ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "done" > .build_success
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v6
        with:
          context: napcat
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:napcat
            ${{ env.REGISTRY }}/${{ github.repository }}:napcat-${{ needs.check-update.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## NapCat Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Version | \`${{ needs.check-update.outputs.version }}\` |"
          echo "| Image | \`${{ env.REGISTRY }}/${{ github.repository }}:napcat\` |"
          echo "| Removed | ffmpeg, libnotify4, libsecret-1-0, gnutls-bin, libglib2.0-dev |"
          echo "| Base | debian:bookworm-slim |"
