name: NapCat

on:
  schedule:
    - cron: '56 18 * * *'  # Check once daily at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
  push:
    paths:
      - 'napcat/**'
      - '.github/workflows/napcat-build.yml'

env:
  REGISTRY: ghcr.io

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      cache_key: ${{ steps.check.outputs.cache_key }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Get NapCat version
        id: version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/NapNeko/NapCatQQ/releases/latest | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if build needed
        id: check
        uses: ./.github/workflows/utils/check-update
        with:
          cache_key: napcat-v2-${{ steps.version.outputs.version }}-${{ github.sha }}

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v6
        with:
          context: napcat
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:napcat
            ${{ env.REGISTRY }}/${{ github.repository }}:napcat-${{ needs.check-update.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit successful build
        if: success()
        uses: ./.github/workflows/utils/commit-successful-update
        with:
          cache_key: ${{ needs.check-update.outputs.cache_key }}

      - name: Summary
        run: |
          echo "## NapCat Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Version | \`${{ needs.check-update.outputs.version }}\` |"
          echo "| Image | \`${{ env.REGISTRY }}/${{ github.repository }}:napcat\` |"
          echo "| Removed | ffmpeg, libnotify4, libsecret-1-0, gnutls-bin, libglib2.0-dev |"
          echo "| Base | debian:bookworm-slim |"
