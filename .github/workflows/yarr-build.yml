name: Yarr

on:
  schedule:
    - cron: '56 18 * * *'  # Check once daily at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
  push:
    paths:
      - 'yarr/**'
      - '.github/workflows/yarr-build.yml'
      - 'scripts/common.sh'

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: nkanaev/yarr
  UPSTREAM_REF: master

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      cache_key: ${{ steps.check.outputs.cache_key }}
      commit: ${{ steps.commit.outputs.commit }}
      short_commit: ${{ steps.commit.outputs.short_commit }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Get upstream commit
        id: commit
        run: |
          COMMIT=$(curl -s "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/commits/${{ env.UPSTREAM_REF }}" | jq -r '.sha')
          if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
            echo "Failed to get upstream commit"
            exit 1
          fi
          SHORT_COMMIT=$(echo "$COMMIT" | cut -c1-7)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "short_commit=$SHORT_COMMIT" >> $GITHUB_OUTPUT
          echo "Upstream commit: $COMMIT"

      - name: Check if build needed
        id: check
        uses: ./.github/workflows/utils/check-update
        with:
          cache_key: yarr-v2-${{ steps.commit.outputs.commit }}-${{ github.sha }}

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone yarr upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          path: yarr-src
          ref: ${{ env.UPSTREAM_REF }}

      - name: Apply patches
        run: |
          source scripts/common.sh
          apply_all_patches yarr yarr-src

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: yarr-src
          file: yarr-src/etc/dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:yarr
            ${{ env.REGISTRY }}/${{ github.repository }}:yarr-${{ needs.check-update.outputs.short_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # platforms: linux/amd64,linux/arm64  # arm64 disabled - QEMU too slow for CGO build
          platforms: linux/amd64

      - name: Commit successful build
        if: success()
        uses: ./.github/workflows/utils/commit-successful-update
        with:
          cache_key: ${{ needs.check-update.outputs.cache_key }}

      - name: Summary
        run: |
          echo "## Yarr Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Upstream Commit | \`${{ needs.check-update.outputs.commit }}\` |"
          echo "| Image | \`${{ env.REGISTRY }}/${{ github.repository }}:yarr\` |"
          echo "| Retention | 30 days, min 20 items per feed (patched from 90/50) |"
