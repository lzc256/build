name: New-API - Custom Build

on:
  schedule:
    - cron: '56 18 * * *'  # Check once daily at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream branch, tag, or commit to build (default: main)'
        required: false
        default: main
        type: string
  push:
    paths:
      - 'new-api/**'
      - '.github/workflows/new-api-build.yml'
      - 'scripts/common.sh'

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: QuantumNous/new-api

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      cache_key: ${{ steps.check.outputs.cache_key }}
      commit: ${{ steps.upstream.outputs.commit }}
      short_commit: ${{ steps.upstream.outputs.short_commit }}
      ref: ${{ steps.upstream.outputs.ref }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Resolve upstream commit
        id: upstream
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          REF="${INPUT_REF:-main}"
          COMMIT=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${REF}" | jq -r '.sha // empty')
          if [ -z "$COMMIT" ]; then
            echo "Failed to resolve upstream ref: $REF"
            exit 1
          fi
          SHORT_COMMIT="${COMMIT:0:7}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_commit=$SHORT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Upstream ref: $REF"
          echo "Upstream commit: $COMMIT"

      - name: Check if build needed
        id: check
        uses: ./.github/workflows/utils/check-update
        with:
          cache_key: newapi-v3-${{ steps.upstream.outputs.commit }}-${{ github.sha }}

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone new-api upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          path: new-api-src
          ref: ${{ needs.check-update.outputs.commit }}

      - name: Apply balance-script patch
        run: |
          source scripts/common.sh
          apply_patch balance-script new-api-src

      - name: Apply use-default-model patch
        run: |
          source scripts/common.sh
          apply_patch use-default-model new-api-src

      - name: Apply billing-header-filter patch
        run: |
          source scripts/common.sh
          apply_patch billing-header-filter new-api-src

      - name: Apply responses-chat-compat patch
        run: |
          source scripts/common.sh
          apply_patch responses-chat-compat new-api-src

      - name: Apply responses-chat-compat-i18n script
        run: |
          source scripts/common.sh
          apply_patch responses-chat-compat-i18n new-api-src

      # - name: Apply zero-completion-compact-error patch
      #   run: |
      #     source scripts/common.sh
      #     apply_patch zero-completion-compact-error new-api-src

      - name: Verify patches applied
        run: |
          echo "=== Patch verification ==="
          git -C new-api-src diff --stat
          test -f new-api-src/controller/channel_balance_script.go && echo "balance-script: channel_balance_script.go OK" || echo "balance-script: channel_balance_script.go MISSING"
          grep -q "handleUseDefault" new-api-src/web/default/src/features/models/components/dialogs/missing-models-dialog.tsx && echo "use-default-model: handleUseDefault OK" || echo "use-default-model: handleUseDefault MISSING"
          test -f new-api-src/relay/common/builtin_override.go && echo "billing-header-filter: builtin_override.go OK" || echo "billing-header-filter: builtin_override.go MISSING"
          test -f new-api-src/relay/responses_via_chat_completions.go && echo "responses-chat-compat: responses_via_chat_completions.go OK" || echo "responses-chat-compat: responses_via_chat_completions.go MISSING"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: new-api-src
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:newapi
            ${{ env.REGISTRY }}/${{ github.repository }}:newapi-${{ needs.check-update.outputs.short_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit successful build
        if: success()
        uses: ./.github/workflows/utils/commit-successful-update
        with:
          cache_key: ${{ needs.check-update.outputs.cache_key }}

      - name: Summary
        run: |
          echo "## New-API Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Upstream Ref | \`${{ needs.check-update.outputs.ref }}\` |"
          echo "| Upstream Commit | \`${{ needs.check-update.outputs.commit }}\` |"
          echo "| Image (latest) | \`${{ env.REGISTRY }}/${{ github.repository }}:newapi\` |"
          echo "| Image (commit) | \`${{ env.REGISTRY }}/${{ github.repository }}:newapi-${{ needs.check-update.outputs.short_commit }}\` |"
