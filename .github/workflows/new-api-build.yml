name: New-API - Custom Build

on:
  schedule:
    - cron: '56 18 * * *'  # Check once daily at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (e.g. v0.10.8-rc.1)'
        required: false
        type: string
  push:
    paths:
      - 'new-api/**'
      - '.github/workflows/new-api-build.yml'
      - 'scripts/common.sh'

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: QuantumNous/new-api

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Get latest upstream release/tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            # Get the latest release (including pre-release/rc)
            TAG=$(curl -sfL "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases?per_page=1" \
              | jq -r '.[0].tag_name // empty')
            if [ -z "$TAG" ]; then
              # Fallback: get latest tags
              TAG=$(curl -sfL "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/tags?per_page=1" \
                | jq -r '.[0].name // empty')
            fi
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No upstream tag found"
            echo "tag=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "combined_key=newapi-${TAG}" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $TAG"

      - name: Cache check
        if: github.event_name != 'push' && steps.tag.outputs.tag != ''
        id: cache
        uses: actions/cache@v4
        with:
          path: .build_success
          key: ${{ steps.tag.outputs.combined_key }}

      - name: Compare
        id: compare
        run: |
          if [ -z "${{ steps.tag.outputs.tag }}" ]; then
            echo "No tag found. Skipping."
            echo "should_build=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Push triggered. Building."
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ -f .build_success ]; then
            echo "Already built for ${{ steps.tag.outputs.tag }}. Skipping."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New tag ${{ steps.tag.outputs.tag }} detected. Building."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "done" > .build_success
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true' && needs.check-update.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone new-api upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          path: new-api-src
          ref: ${{ needs.check-update.outputs.tag }}

      - name: Apply balance-script patch
        run: |
          source scripts/common.sh
          apply_patch balance-script new-api-src

      - name: Apply use-default-model patch
        run: |
          source scripts/common.sh
          apply_patch use-default-model new-api-src

      - name: Apply billing-header-filter patch
        run: |
          source scripts/common.sh
          apply_patch billing-header-filter new-api-src

      - name: Apply responses-chat-compat patch
        run: |
          source scripts/common.sh
          apply_patch responses-chat-compat new-api-src

      - name: Apply responses-chat-compat-i18n script
        run: |
          source scripts/common.sh
          apply_patch responses-chat-compat-i18n new-api-src

      # - name: Apply zero-completion-compact-error patch
      #   run: |
      #     source scripts/common.sh
      #     apply_patch zero-completion-compact-error new-api-src

      - name: Verify patches applied
        run: |
          echo "=== Patch verification ==="
          git -C new-api-src diff --stat
          test -f new-api-src/controller/channel_balance_script.go && echo "balance-script: channel_balance_script.go OK" || echo "balance-script: channel_balance_script.go MISSING"
          grep -q "handleUseDefault" new-api-src/web/default/src/features/models/components/dialogs/missing-models-dialog.tsx && echo "use-default-model: handleUseDefault OK" || echo "use-default-model: handleUseDefault MISSING"
          test -f new-api-src/relay/common/builtin_override.go && echo "billing-header-filter: builtin_override.go OK" || echo "billing-header-filter: builtin_override.go MISSING"
          test -f new-api-src/relay/responses_via_chat_completions.go && echo "responses-chat-compat: responses_via_chat_completions.go OK" || echo "responses-chat-compat: responses_via_chat_completions.go MISSING"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: new-api-src
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:newapi
            ${{ env.REGISTRY }}/${{ github.repository }}:newapi-${{ needs.check-update.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## New-API Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Upstream Tag | \`${{ needs.check-update.outputs.tag }}\` |"
          echo "| Image (latest) | \`${{ env.REGISTRY }}/${{ github.repository }}:newapi\` |"
          echo "| Image (version) | \`${{ env.REGISTRY }}/${{ github.repository }}:newapi-${{ needs.check-update.outputs.tag }}\` |"
