name: Cleanup Untagged Images

on:
  schedule:
    - cron: '0 4 * * *'  # Run daily at 4:00 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete untagged images older than 7 days
        uses: actions/delete-package-versions@v5
        with:
          package-name: build
          package-type: container
          delete-only-untagged-versions: true
          num-old-versions-to-delete: 100
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Image Cleanup Summary"
          echo "Deleted up to 100 untagged images"
