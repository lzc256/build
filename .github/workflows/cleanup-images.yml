name: Cleanup Untagged Images

on:
  schedule:
    - cron: '12 21 * * *'  # Run daily at 05:12 Beijing time (21:12 UTC)
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old unreferenced images
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: build
          tag-selection: untagged
          cut-off: 1d
          dry-run: false
