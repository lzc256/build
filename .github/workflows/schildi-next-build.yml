name: SchildiChat Next - Build (voice composer patches)

on:
  schedule:
    - cron: '26 18 */5 * *'  # Every 5 days at 02:26 Beijing time (18:26 UTC)
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'schildichat-android-next branch/tag/commit. Leave empty to use latest main.'
        required: false
  push:
    paths:
      - 'schildi-next/**'
      - '.github/workflows/schildi-next-build.yml'
      - 'scripts/common.sh'

env:
  UPSTREAM_REPO: SchildiChat/schildichat-android-next
  UPSTREAM_REF: main
  # Same as the upstream CI, minus the configuration cache (not needed for a one-shot build)
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
    -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon --no-configuration-cache
  # SchildiChat only publishes the default variant: default app id is chat.schildi.android
  GRADLE_TASK: ':app:assembleFdroidScDefaultRelease'
  # Only package the arm64-v8a split, that is the only ABI we distribute
  BUILD_ABI: 'arm64-v8a'
  APK_NAME: 'app-fdroid-sc-default-arm64-v8a-release.apk'
  # Fixed tag so that the download URL stays stable and the APK is persisted
  RELEASE_TAG: 'out/schildi-next'

concurrency:
  group: schildi-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      cache_key: ${{ steps.check.outputs.cache_key }}
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Resolve upstream commit
        id: resolve
        run: |
          REF="${{ github.event.inputs.upstream_ref || env.UPSTREAM_REF }}"
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            SHA="$REF"
          else
            SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "$REF" | cut -f1 | head -n1)
            if [ -z "$SHA" ]; then
              # Not a branch, so it may be a tag
              SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/tags/$REF^{}" | cut -f1 | head -n1)
            fi
          fi
          if [ -z "$SHA" ]; then
            echo "::error::Failed to resolve upstream ref '$REF'"
            exit 1
          fi
          echo "upstream_sha=$SHA" >> $GITHUB_OUTPUT
          echo "Upstream ref $REF resolved to $SHA"

      - name: Check if build needed
        id: check
        uses: ./.github/workflows/utils/check-update
        with:
          cache_key: schildi-next-v1-${{ steps.resolve.outputs.upstream_sha }}-${{ github.sha }}
          skip_cache: ${{ github.event_name == 'workflow_dispatch' }}

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Clone upstream
        run: |
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${UPSTREAM_REPO}.git" schildi-next-src
          cd schildi-next-src
          git checkout "${{ needs.check-update.outputs.upstream_sha }}"

      - name: Apply patches
        run: |
          source scripts/common.sh
          apply_all_patches schildi-next schildi-next-src

      - name: Show patched files
        run: git -C schildi-next-src status --short

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        working-directory: schildi-next-src
        run: |
          ./gradlew ${{ env.GRADLE_TASK }} \
            -PscBuildAbi=${{ env.BUILD_ABI }} \
            ${{ env.CI_GRADLE_ARG_PROPERTIES }}

      - name: Collect the arm64-v8a APK
        run: |
          rm -rf apks && mkdir -p apks
          find schildi-next-src/app/build/outputs/apk -name "${{ env.APK_NAME }}" -exec cp {} apks/ \;
          if [ ! -f "apks/${{ env.APK_NAME }}" ]; then
            echo "::error::APK ${{ env.APK_NAME }} was not produced"
            find schildi-next-src/app/build/outputs/apk -name '*.apk' || true
            exit 1
          fi
          ls -la apks
          sha256sum "apks/${{ env.APK_NAME }}"

      - name: Verify the APK
        run: |
          BUILD_TOOLS=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "apks/${APK_NAME}" | grep -E '^(package|application-label|native-code|targetSdkVersion):')
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='chat.schildi.android.mod'" \
            || { echo "::error::unexpected package id"; exit 1; }
          echo "$BADGING" | grep -q "native-code: 'arm64-v8a'" \
            || { echo "::error::unexpected native code"; exit 1; }

      - name: Publish the APK to ${{ env.RELEASE_TAG }} (overwrites the previous one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.check-update.outputs.upstream_sha }}
        run: |
          # Drop the previous release (and its tag) so that the asset is always replaced
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true
          gh release create "${RELEASE_TAG}" "apks/${APK_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SchildiChat Next (out)" \
            --latest=false \
            --notes "SchildiChat Next APK built from upstream \`${UPSTREAM_SHA}\` with the voice composer patches:
          - long press an empty message box to record, release to send, slide up to cancel
          - stop recording to get a preview with a \"continue recording\" button (also works after coming back from the background)
          - the existing microphone button still records / stops as before

          arm64-v8a split, package \`chat.schildi.android.mod\`: installs next to the official SchildiChat Next instead of replacing it (separate data and login redirect), signed with the upstream debug keystore."

      - name: Commit successful build
        if: success()
        uses: ./.github/workflows/utils/commit-successful-update
        with:
          cache_key: schildi-next-v1-${{ needs.check-update.outputs.upstream_sha }}-${{ github.sha }}
