name: Cmd2API - Docker Build

on:
  schedule:
    - cron: '56 18 * * *'  # Check once daily at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream branch, tag, or commit to build (default: main)'
        required: false
        default: main
        type: string
  push:
    paths:
      - '.github/workflows/cmd2api-build.yml'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: maplevoid/cmd2api
  UPSTREAM_REF: main

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      cache_key: ${{ steps.check.outputs.cache_key }}
      commit: ${{ steps.upstream.outputs.commit }}
      short_commit: ${{ steps.upstream.outputs.short_commit }}
      ref: ${{ steps.upstream.outputs.ref }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Resolve upstream commit
        id: upstream
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          REF="${INPUT_REF:-${UPSTREAM_REF}}"
          COMMIT=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${REF}" | jq -r '.sha // empty')
          if [ -z "$COMMIT" ]; then
            echo "Failed to resolve upstream ref: $REF"
            exit 1
          fi
          SHORT_COMMIT="${COMMIT:0:7}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_commit=$SHORT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Upstream ref: $REF"
          echo "Upstream commit: $COMMIT"

      - name: Check if build needed
        id: check
        uses: ./.github/workflows/utils/check-update
        with:
          cache_key: cmd2api-v2-${{ steps.upstream.outputs.commit }}

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone cmd2api upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          path: cmd2api-src
          ref: ${{ needs.check-update.outputs.commit }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: cmd2api-src
          file: cmd2api-src/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:cmd2api
            ${{ env.REGISTRY }}/${{ github.repository }}:cmd2api-${{ needs.check-update.outputs.short_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit successful build
        if: success()
        uses: ./.github/workflows/utils/commit-successful-update
        with:
          cache_key: ${{ needs.check-update.outputs.cache_key }}

      - name: Summary
        run: |
          echo "## Cmd2API Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Upstream Ref | \`${{ needs.check-update.outputs.ref }}\` |"
          echo "| Upstream Commit | \`${{ needs.check-update.outputs.commit }}\` |"
          echo "| Image (latest) | \`${{ env.REGISTRY }}/${{ github.repository }}:cmd2api\` |"
          echo "| Image (commit) | \`${{ env.REGISTRY }}/${{ github.repository }}:cmd2api-${{ needs.check-update.outputs.short_commit }}\` |"
