name: Loki - Build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref (tag/branch/commit). Leave empty to use latest release.'
        required: false
      patch:
        description: 'Patch to apply: android, stubs, or all. Leave empty for all.'
        required: false
        default: 'all'
  push:
    paths:
      - 'loki/**'
      - '.github/workflows/loki-build.yml'
      - 'scripts/common.sh'

env:
  UPSTREAM_REPO: unmojang/Loki
  UPSTREAM_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone Loki upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref || env.UPSTREAM_REF }}
          path: loki-src
          fetch-depth: 0

      - name: Apply patch
        env:
          PATCH_NAME: ${{ inputs.patch || 'all' }}
        run: |
          source scripts/common.sh

          case "$PATCH_NAME" in
            all)
              echo "Applying all patches..."
              apply_all_patches loki loki-src
              ;;
            android|stubs)
              # stubs depends on android, apply both
              if [ "$PATCH_NAME" = "stubs" ]; then
                echo "Applying android patch (dependency)..."
                apply_patch "android" loki-src
              fi
              echo "Applying $PATCH_NAME patch..."
              apply_patch "$PATCH_NAME" loki-src
              ;;
            *)
              echo "Unknown patch: $PATCH_NAME"
              exit 1
              ;;
          esac

      - name: Install cross-compiler for stubs
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build stub libraries
        run: |
          mkdir -p loki-src/src/main/resources/libpulse_stub/linux-aarch64
          mkdir -p loki-src/src/main/resources/libudev_stub/linux-aarch64
          mkdir -p loki-src/src/main/resources/libX11_stub/linux-aarch64
          mkdir -p loki-src/src/main/resources/libXfixes_stub/linux-aarch64

          STUBS_DIR="loki/patches/stubs"

          for stub in libpulse libudev libX11 libXfixes; do
            SRC="${STUBS_DIR}/${stub}-stub.c"
            if [ -f "$SRC" ]; then
              SONAME="${stub}.so.$([[ "$stub" = "libXfixes" ]] && echo 3 || ([[ "$stub" = "libX11" ]] && echo 6 || ([[ "$stub" = "libudev" ]] && echo 1 || echo 0)))"
              OUT="loki-src/src/main/resources/${stub}_stub/linux-aarch64/${SONAME}"
              echo "Building ${SONAME} stub..."
              aarch64-linux-gnu-gcc -shared -fPIC -Wl,-soname,${SONAME} -o "$OUT" "$SRC"
              file "$OUT"
            fi
          done

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch Ivy
        run: |
          cd loki-src
          ant ivy

      - name: Build Loki
        run: |
          cd loki-src
          ant -DjavaTarget=1.8

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'name="version"' loki-src/build.xml | grep -oP 'value="\K[^"]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loki-${{ steps.version.outputs.version }}-${{ inputs.patch || 'all' }}
          path: loki-src/build/dist/Loki-*.jar
          retention-days: 30

      - name: Summary
        run: |
          echo "## Loki Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |"
          echo "| Patch | \`${{ inputs.patch || 'all' }}\` |"
