name: Loki - Build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref (tag/branch/commit). Leave empty to use latest release.'
        required: false
      patch:
        description: 'Patch to apply: android, stubs, or all. Leave empty for all.'
        required: false
        default: 'all'
  push:
    paths:
      - 'loki/**'
      - '.github/workflows/loki-build.yml'
      - 'scripts/common.sh'

env:
  UPSTREAM_REPO: unmojang/Loki
  UPSTREAM_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone Loki upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref || env.UPSTREAM_REF }}
          path: loki-src
          fetch-depth: 0

      - name: Apply patch
        env:
          PATCH_NAME: ${{ inputs.patch || 'all' }}
        run: |
          source scripts/common.sh

          case "$PATCH_NAME" in
            all)
              echo "Applying all patches..."
              apply_all_patches loki loki-src
              ;;
            android|stubs)
              # stubs depends on android, apply both
              if [ "$PATCH_NAME" = "stubs" ]; then
                echo "Applying android patch (dependency)..."
                apply_patch "android" loki-src
              fi
              echo "Applying $PATCH_NAME patch..."
              apply_patch "$PATCH_NAME" loki-src
              ;;
            *)
              echo "Unknown patch: $PATCH_NAME"
              exit 1
              ;;
          esac

      - name: Install cross-compiler for stubs
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build stub libraries
        run: |
          # Create resource directories for all stubs
          for stub in libpulse libudev libX11 libXfixes libXrandr libXcursor libXcomposite libXdamage libdbus-1 libstdc++ libm libc libpthread; do
            mkdir -p "loki-src/src/main/resources/${stub}_stub/linux-aarch64"
          done
          # Create directory for ld-linux stub (special naming)
          mkdir -p "loki-src/src/main/resources/ldlinux_stub/linux-aarch64"

          STUBS_DIR="loki/patches/stubs"

          # Map stub names to their soname versions
          declare -A SONAME_VERSION=(
            ["libpulse"]=0
            ["libudev"]=1
            ["libX11"]=6
            ["libXfixes"]=3
            ["libXrandr"]=2
            ["libXcursor"]=1
            ["libXcomposite"]=1
            ["libXdamage"]=1
            ["libdbus-1"]=3
            ["libstdc++"]=6
            ["libm"]=6
            ["libc"]=6
            ["libpthread"]=0
          )

          # Map stub names to compiler (use gcc for libstdc++ to avoid double-mangling)
          declare -A COMPILER=(
            ["libstdc++"]="aarch64-linux-gnu-gcc"
          )

          # Map stub names to additional compiler flags
          declare -A CFLAGS_EXTRA=(
            ["libstdc++"]="-nostdlib"
            ["libc"]="-nostdlib"
            ["libpthread"]="-nostdlib"
          )

          for stub in libpulse libudev libX11 libXfixes libXrandr libXcursor libXcomposite libXdamage libdbus-1 libstdc++ libm libc libpthread; do
            SRC="${STUBS_DIR}/${stub}-stub.c"
            if [ -f "$SRC" ]; then
              VER="${SONAME_VERSION[$stub]}"
              SONAME="${stub}.so.${VER}"
              OUT="loki-src/src/main/resources/${stub}_stub/linux-aarch64/${SONAME}"
              CC="${COMPILER[$stub]:-aarch64-linux-gnu-gcc}"
              EXTRA="${CFLAGS_EXTRA[$stub]:-}"
              echo "Building ${SONAME} stub with ${CC} ${EXTRA}..."
              ${CC} -shared -fPIC ${EXTRA} -Wl,-soname,${SONAME} -o "$OUT" "$SRC"
              file "$OUT"
            else
              echo "Warning: ${stub}-stub.c not found, skipping"
            fi
          done

          # Build ld-linux-aarch64.so.1 stub (special handling - no version suffix)
          LD_SRC="${STUBS_DIR}/ld-linux-aarch64-stub.c"
          if [ -f "$LD_SRC" ]; then
            LD_SONAME="ld-linux-aarch64.so.1"
            LD_OUT="loki-src/src/main/resources/ldlinux_stub/linux-aarch64/${LD_SONAME}"
            echo "Building ${LD_SONAME} stub..."
            aarch64-linux-gnu-gcc -shared -fPIC -nostdlib -Wl,-soname,${LD_SONAME} -o "$LD_OUT" "$LD_SRC"
            file "$LD_OUT"
          else
            echo "Warning: ld-linux-aarch64-stub.c not found, skipping"
          fi

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch Ivy
        run: |
          cd loki-src
          ant ivy

      - name: Build Loki
        run: |
          cd loki-src
          ant -DjavaTarget=1.8

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'name="version"' loki-src/build.xml | grep -oP 'value="\K[^"]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loki-${{ steps.version.outputs.version }}-${{ inputs.patch || 'all' }}
          path: loki-src/build/dist/Loki-*.jar
          retention-days: 30

      - name: Summary
        run: |
          echo "## Loki Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |"
          echo "| Patch | \`${{ inputs.patch || 'all' }}\` |"
