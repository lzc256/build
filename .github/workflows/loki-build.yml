name: Loki - Build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref (tag/branch/commit). Leave empty to use latest release.'
        required: false
      patch:
        description: 'Patch to apply (debug-trace or no-retransform). Leave empty for debug-trace.'
        required: false
        default: 'debug-trace'
  push:
    paths:
      - 'loki/**'
      - '.github/workflows/loki-build.yml'
      - 'scripts/common.sh'

env:
  UPSTREAM_REPO: unmojang/Loki
  UPSTREAM_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone Loki upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref || env.UPSTREAM_REF }}
          path: loki-src
          fetch-depth: 0

      - name: Apply patch
        env:
          PATCH_NAME: ${{ inputs.patch || 'debug-trace' }}
        run: |
          source scripts/common.sh
          apply_patch "$PATCH_NAME" loki-src

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch Ivy
        run: |
          cd loki-src
          ant ivy

      - name: Build Loki
        run: |
          cd loki-src
          ant -DjavaTarget=1.8

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'name="version"' loki-src/build.xml | grep -oP 'value="\K[^"]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loki-${{ steps.version.outputs.version }}-${{ inputs.patch || 'debug-trace' }}
          path: loki-src/build/dist/Loki-*.jar
          retention-days: 30

      - name: Summary
        run: |
          echo "## Loki Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |"
          echo "| Patch | \`${{ inputs.patch || 'debug-trace' }}\` |"
