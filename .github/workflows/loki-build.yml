name: Loki - Build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref (tag/branch/commit). Leave empty to use latest release.'
        required: false
      patch:
        description: 'Patch to apply: android, libpulse-stub-workaround (includes android). Leave empty for android.'
        required: false
        default: 'android'
  push:
    paths:
      - 'loki/**'
      - '.github/workflows/loki-build.yml'
      - 'scripts/common.sh'

env:
  UPSTREAM_REPO: unmojang/Loki
  UPSTREAM_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone Loki upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref || env.UPSTREAM_REF }}
          path: loki-src
          fetch-depth: 0

      - name: Apply patch
        env:
          PATCH_NAME: ${{ inputs.patch || 'android' }}
        run: |
          source scripts/common.sh

          # libpulse-stub-workaround depends on android patch
          # Apply android first, then libpulse-stub-workaround
          if [ "$PATCH_NAME" = "libpulse-stub-workaround" ]; then
            echo "Applying android patch first (dependency)..."
            apply_patch "android" loki-src
            echo "Applying libpulse-stub-workaround patch..."
            apply_patch "libpulse-stub-workaround" loki-src
          else
            apply_patch "$PATCH_NAME" loki-src
          fi

      - name: Install cross-compiler for libpulse stub
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build libpulse.so.0 stub (for libpulse-stub-workaround)
        run: |
          # Create output directory
          mkdir -p loki-src/src/main/resources/libpulse_stub/linux-aarch64

          # Check if stub source exists (from libpulse-stub-workaround patch)
          STUB_SRC="loki/patches/libpulse-stub-workaround/libpulse-stub.c"
          if [ -f "$STUB_SRC" ]; then
            echo "Building libpulse.so.0 stub from $STUB_SRC"
            aarch64-linux-gnu-gcc -shared -fPIC \
              -Wl,-soname,libpulse.so.0 \
              -o loki-src/src/main/resources/libpulse_stub/linux-aarch64/libpulse.so.0 \
              "$STUB_SRC"

            echo "Built libpulse.so.0 stub:"
            file loki-src/src/main/resources/libpulse_stub/linux-aarch64/libpulse.so.0
            ls -la loki-src/src/main/resources/libpulse_stub/linux-aarch64/libpulse.so.0
          else
            echo "No libpulse-stub.c found, skipping stub build (not needed for this patch)"
          fi

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch Ivy
        run: |
          cd loki-src
          ant ivy

      - name: Build Loki
        run: |
          cd loki-src
          ant -DjavaTarget=1.8

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'name="version"' loki-src/build.xml | grep -oP 'value="\K[^"]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loki-${{ steps.version.outputs.version }}-${{ inputs.patch || 'android' }}
          path: loki-src/build/dist/Loki-*.jar
          retention-days: 30

      - name: Summary
        run: |
          echo "## Loki Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |"
          echo "| Patch | \`${{ inputs.patch || 'android' }}\` |"
