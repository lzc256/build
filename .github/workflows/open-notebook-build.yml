name: Open-Notebook - Slim Build

on:
  schedule:
    - cron: '56 18 * * *'  # Check once daily at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
    inputs:
      build_multi:
        description: 'Also build multi-container image (Dockerfile)'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'open-notebook/**'
      - '.github/workflows/open-notebook-build.yml'
      - 'scripts/common.sh'

env:
  REGISTRY: ghcr.io
  UPSTREAM_IMAGE: lfnovo/open_notebook

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Get upstream digest
        id: digest
        run: |
          # Get amd64 digest from Docker Hub
          DIGEST=$(docker manifest inspect ${{ env.UPSTREAM_IMAGE }}:v1-latest 2>/dev/null | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "Failed to get upstream digest"
            exit 1
          fi
          # Extract just the hash part (remove sha256: prefix) for use in tag
          DIGEST_HASH=$(echo "$DIGEST" | sed 's/sha256://')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "digest_hash=$DIGEST_HASH" >> $GITHUB_OUTPUT
          echo "combined_key=open-notebook-${DIGEST_HASH}" >> $GITHUB_OUTPUT
          echo "Upstream amd64 digest: $DIGEST"

      - name: Cache check
        if: github.event_name != 'push'
        id: cache
        uses: actions/cache@v4
        with:
          path: .build_success
          key: ${{ steps.digest.outputs.combined_key }}

      - name: Compare
        id: compare
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push triggered. Building."
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ -f .build_success ]; then
            echo "No updates detected. Skipping."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Updates detected. Proceeding to build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "done" > .build_success
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone open-notebook
        uses: actions/checkout@v4
        with:
          repository: lfnovo/open-notebook
          path: open-notebook-src
          ref: main

      - name: Apply patches
        run: |
          source scripts/common.sh
          apply_all_patches open-notebook open-notebook-src

      - name: Show patched Dockerfile diff
        run: |
          echo "=== Dockerfile Changes ==="
          git -C open-notebook-src diff Dockerfile | head -150
          echo ""
          echo "=== Dockerfile.single Changes ==="
          git -C open-notebook-src diff Dockerfile.single | head -150

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push (single-container)
        uses: docker/build-push-action@v6
        with:
          context: open-notebook-src
          file: open-notebook-src/Dockerfile.single
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:open-notebook
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push (multi-container)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_multi == true }}
        uses: docker/build-push-action@v6
        with:
          context: open-notebook-src
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:open-notebook-multi
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Open-Notebook Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Upstream Digest | \`${{ needs.check-update.outputs.digest }}\` |"
          echo "| Image (single) | \`${{ env.REGISTRY }}/${{ github.repository }}:open-notebook\` |"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_multi }}" = "true" ]; then
            echo "| Image (multi) | \`${{ env.REGISTRY }}/${{ github.repository }}:open-notebook-multi\` |"
          fi
