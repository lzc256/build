name: FjordLauncher - Build

on:
  schedule:
    - cron: '0 3 */5 * *'  # Check every 5 days at 3:00 UTC
  workflow_dispatch:
    inputs:
      fjord_ref:
        description: 'FjordLauncher branch/tag/commit'
        required: false
        default: 'develop'
  push:
    paths:
      - 'fjordlauncher/**'
      - '.github/workflows/fjordlauncher-build.yml'
      - 'scripts/common.sh'

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      fjord_sha: ${{ steps.hashes.outputs.fjord_sha }}
    steps:
      - name: Get Latest Hash
        id: hashes
        run: |
          FJORD_SHA=$(curl -s https://api.github.com/repos/unmojang/FjordLauncher/commits/develop | jq -r .sha)
          echo "fjord_sha=$FJORD_SHA" >> $GITHUB_OUTPUT
          echo "combined_key=fjordlauncher-${FJORD_SHA}" >> $GITHUB_OUTPUT
          echo "FjordLauncher SHA: $FJORD_SHA"

      - name: Cache Check
        if: github.event_name != 'push'
        id: cache_check
        uses: actions/cache@v4
        with:
          path: build_status.txt
          key: ${{ steps.hashes.outputs.combined_key }}

      - name: Compare
        id: compare
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push triggered. Building."
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ -f build_status.txt ]; then
            echo "No updates detected. Skipping."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Updates detected. Proceeding to build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "done" > build_status.txt
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 6.10.2

          - os: macos-14
            artifact-name: macOS
            cmake-preset: macos_universal
            qt-version: 6.9.3

          - os: windows-2022
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            qt-version: 6.10.2

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Release
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone FjordLauncher
        uses: actions/checkout@v4
        with:
          repository: unmojang/FjordLauncher
          ref: ${{ github.event.inputs.fjord_ref || 'develop' }}
          path: fjordlauncher-src
          submodules: recursive

      - name: Apply patch
        run: |
          source scripts/common.sh
          apply_patch 01-remove-msa-requirement fjordlauncher-src

      - name: Show patched files
        run: git -C fjordlauncher-src status --short

      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install \
            dpkg-dev \
            ninja-build extra-cmake-modules pkg-config scdoc \
            cmark gamemode-dev libarchive-dev libcmark-dev libqrencode-dev zlib1g-dev \
            libxcb-cursor-dev libtomlplusplus-dev libvulkan-dev

      # macOS dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja extra-cmake-modules temurin@17 mono

      - name: Set JAVA_HOME (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"

      - name: Setup vcpkg environment (macOS/Windows MSVC)
        if: runner.os == 'macOS' || (runner.os == 'Windows' && matrix.cmake-preset == 'windows_msvc')
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # Windows MSVC setup
      - name: Enter VS Developer shell (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          vsversion: 2022

      - name: Setup Java (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.1.*"
          version: ${{ matrix.qt-version }}
          modules: qtimageformats qtnetworkauth

      # Build
      - name: Configure project
        run: |
          cd fjordlauncher-src
          cmake --preset "$CMAKE_PRESET"

      - name: Build
        run: |
          cd fjordlauncher-src
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      # Package - use cmake --install instead of cpack
      - name: Get short version
        id: short-version
        run: |
          echo "version=$(cd fjordlauncher-src && git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd fjordlauncher-src
          cmake --install build --config "$BUILD_TYPE" --prefix install
          cd install
          tar -czvf ../FjordLauncher-Linux-${{ steps.short-version.outputs.version }}.tar.gz .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd fjordlauncher-src
          cmake --install build --config "$BUILD_TYPE" --prefix install
          cd install
          zip -r ../FjordLauncher-macOS-${{ steps.short-version.outputs.version }}.zip .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd fjordlauncher-src
          cmake --install build --config "$BUILD_TYPE" --prefix install
          Compress-Archive -Path install/* -DestinationPath FjordLauncher-Windows-${{ steps.short-version.outputs.version }}.zip

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fjordlauncher-Linux-${{ steps.short-version.outputs.version }}
          path: fjordlauncher-src/FjordLauncher-Linux-${{ steps.short-version.outputs.version }}.tar.gz
          retention-days: 30

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: fjordlauncher-macOS-${{ steps.short-version.outputs.version }}
          path: fjordlauncher-src/FjordLauncher-macOS-${{ steps.short-version.outputs.version }}.zip
          retention-days: 30

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: fjordlauncher-Windows-${{ steps.short-version.outputs.version }}
          path: fjordlauncher-src/FjordLauncher-Windows-${{ steps.short-version.outputs.version }}.zip
          retention-days: 30

      - name: Summary
        run: |
          echo "## FjordLauncher Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Upstream SHA | \`${{ needs.check-update.outputs.fjord_sha }}\` |"
          echo "| Platform | ${{ matrix.artifact-name }} |"
          echo "| Qt Version | ${{ matrix.qt-version }} |"
