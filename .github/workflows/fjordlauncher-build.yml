name: FjordLauncher - Build

on:
  schedule:
    - cron: '56 18 */5 * *'  # Check every 5 days at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag (e.g., 11.0.2.0). Leave empty to use latest.'
        required: false
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      # Test phase defaults (enabled)
      build_mac_arm64_zip:
        description: 'macOS arm64 zip'
        type: boolean
        default: true
      build_linux_x86_64_appimage:
        description: 'Linux x86_64 AppImage'
        type: boolean
        default: true
      build_windows_msvc_x86_64_portable:
        description: 'Windows MSVC x86_64 Portable'
        type: boolean
        default: true
      build_windows_msvc_x86_64_setup:
        description: 'Windows MSVC x86_64 Setup'
        type: boolean
        default: true
      # Additional artifacts (disabled in test phase)
      build_linux_x86_64_portable:
        description: 'Linux x86_64 Portable'
        type: boolean
        default: false
      build_mac_universal_zip:
        description: 'macOS universal zip'
        type: boolean
        default: false
      build_windows_msvc_arm64:
        description: 'Windows MSVC arm64'
        type: boolean
        default: false
  push:
    paths:
      - 'fjordlauncher/**'
      - '.github/workflows/fjordlauncher-build.yml'
      - 'scripts/common.sh'

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      upstream_tag: ${{ steps.hashes.outputs.upstream_tag }}
      upstream_sha: ${{ steps.hashes.outputs.upstream_sha }}
    steps:
      - name: Get Latest Release
        id: hashes
        run: |
          # Use explicit tag from workflow_dispatch input, or fetch latest release
          if [ -n "${{ github.event.inputs.upstream_tag }}" ]; then
            UPSTREAM_TAG="${{ github.event.inputs.upstream_tag }}"
          else
            RELEASE=$(curl -s https://api.github.com/repos/unmojang/FjordLauncher/releases/latest)
            UPSTREAM_TAG=$(echo "$RELEASE" | jq -r .tag_name)
          fi

          # Get the commit SHA for this tag
          UPSTREAM_SHA=$(curl -s "https://api.github.com/repos/unmojang/FjordLauncher/commits/${UPSTREAM_TAG}" | jq -r .sha)

          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "combined_key=fjordlauncher-${UPSTREAM_TAG}" >> $GITHUB_OUTPUT
          echo "Upstream Release: $UPSTREAM_TAG (SHA: $UPSTREAM_SHA)"

      - name: Cache Check
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'push'
        id: cache_check
        uses: actions/cache@v4
        with:
          path: build_status.txt
          key: ${{ steps.hashes.outputs.combined_key }}

      - name: Compare
        id: compare
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push triggered. Building."
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch triggered. Building."
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ -f build_status.txt ]; then
            echo "No updates detected. Skipping."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New release detected. Proceeding to build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "done" > build_status.txt
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS arm64 (test phase: enabled)
          - os: macos-14
            artifact-name: macOS-arm64
            cmake-preset: macos
            qt-version: 6.9.3
            artifact-key: mac_arm64_zip

          # Linux x86_64 (test phase: enabled)
          - os: ubuntu-24.04
            artifact-name: Linux-x86_64
            cmake-preset: linux
            qt-version: 6.10.2
            artifact-key: linux_x86_64_appimage

          # Windows MSVC x86_64 (test phase: enabled)
          - os: windows-2022
            artifact-name: Windows-MSVC-x86_64
            cmake-preset: windows_msvc
            qt-version: 6.10.2
            artifact-key: windows_msvc_x86_64

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Release
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:
      - name: Check if artifact is enabled
        id: check-enabled
        run: |
          KEY="${{ matrix.artifact-key }}"

          # Get input values (empty if not set)
          INPUT_MAC_ARM64="${{ github.event.inputs.build_mac_arm64_zip }}"
          INPUT_LINUX_X86_64="${{ github.event.inputs.build_linux_x86_64_appimage }}"
          INPUT_WINDOWS_MSVC="${{ github.event.inputs.build_windows_msvc_x86_64_portable }}"
          INPUT_LINUX_PORTABLE="${{ github.event.inputs.build_linux_x86_64_portable }}"
          INPUT_MAC_UNIVERSAL="${{ github.event.inputs.build_mac_universal_zip }}"
          INPUT_WINDOWS_ARM64="${{ github.event.inputs.build_windows_msvc_arm64 }}"

          # Determine enabled status with defaults
          case "$KEY" in
            mac_arm64_zip)
              INPUT_VAL="${INPUT_MAC_ARM64:-true}"
              ;;
            linux_x86_64_appimage)
              INPUT_VAL="${INPUT_LINUX_X86_64:-true}"
              ;;
            windows_msvc_x86_64)
              INPUT_VAL="${INPUT_WINDOWS_MSVC:-true}"
              ;;
            linux_x86_64_portable)
              INPUT_VAL="${INPUT_LINUX_PORTABLE:-false}"
              ;;
            mac_universal_zip)
              INPUT_VAL="${INPUT_MAC_UNIVERSAL:-false}"
              ;;
            windows_msvc_arm64)
              INPUT_VAL="${INPUT_WINDOWS_ARM64:-false}"
              ;;
            *)
              INPUT_VAL="false"
              ;;
          esac

          echo "Artifact: $KEY, Enabled: $INPUT_VAL"
          echo "enabled=$INPUT_VAL" >> $GITHUB_OUTPUT

      - name: Checkout patch framework
        if: steps.check-enabled.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Clone FjordLauncher
        if: steps.check-enabled.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: unmojang/FjordLauncher
          ref: ${{ needs.check-update.outputs.upstream_tag }}
          path: fjordlauncher-src
          submodules: recursive

      - name: Apply patch
        if: steps.check-enabled.outputs.enabled == 'true'
        run: |
          source scripts/common.sh
          apply_patch 01-remove-msa-requirement fjordlauncher-src

      - name: Show patched files
        if: steps.check-enabled.outputs.enabled == 'true'
        run: git -C fjordlauncher-src status --short

      # Linux dependencies
      - name: Install Linux dependencies
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install \
            dpkg-dev \
            ninja-build extra-cmake-modules pkg-config scdoc \
            cmark gamemode-dev libarchive-dev libcmark-dev libqrencode-dev zlib1g-dev \
            libxcb-cursor-dev libtomlplusplus-dev libvulkan-dev \
            file desktop-file-utils rpm libfuse2

      - name: Install AppImage tools (Linux)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          mkdir -p ~/bin

          # Install sharun
          curl -L "https://github.com/VHSgunzo/sharun/releases/latest/download/sharun-$(uname -m)" -o ~/bin/sharun
          chmod +x ~/bin/sharun

          # Install mkappimage
          curl -L "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$(uname -m).AppImage" -o ~/bin/mkappimage
          chmod +x ~/bin/mkappimage

          # Install AppImageUpdate for delta updates
          curl -L "https://github.com/AppImage/AppImageUpdate/releases/latest/download/AppImageUpdate-$(uname -m).AppImage" -o ~/bin/AppImageUpdate.AppImage
          chmod +x ~/bin/AppImageUpdate.AppImage

          echo "$HOME/bin" >> $GITHUB_PATH

      # macOS dependencies
      - name: Install macOS dependencies
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'macOS'
        run: |
          brew update
          brew install ninja extra-cmake-modules temurin@17 mono

      - name: Set JAVA_HOME (macOS)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'macOS'
        run: |
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"

      - name: Setup vcpkg environment (macOS/Windows MSVC)
        if: steps.check-enabled.outputs.enabled == 'true' && (runner.os == 'macOS' || (runner.os == 'Windows' && matrix.cmake-preset == 'windows_msvc'))
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # Windows MSVC setup
      - name: Enter VS Developer shell (Windows)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          vsversion: 2022

      - name: Setup Java (Windows)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Windows'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      # Install Qt
      - name: Install Qt
        if: steps.check-enabled.outputs.enabled == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.1.*"
          version: ${{ matrix.qt-version }}
          modules: qtimageformats qtnetworkauth

      # Build
      - name: Configure project
        if: steps.check-enabled.outputs.enabled == 'true'
        run: |
          cd fjordlauncher-src
          cmake --preset "$CMAKE_PRESET"

      - name: Build
        if: steps.check-enabled.outputs.enabled == 'true'
        run: |
          cd fjordlauncher-src
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      # Package Linux
      - name: Setup build variables (Linux)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          APPIMAGE_ARCH="x86_64"
          echo "APPIMAGE_ARCH=$APPIMAGE_ARCH" >> $GITHUB_ENV
          echo "DEB_HOST_MULTIARCH=$(dpkg-architecture -q DEB_HOST_MULTIARCH)" >> $GITHUB_ENV

      - name: Package AppImage (Linux)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          cd fjordlauncher-src
          cmake --install build --config "$BUILD_TYPE" --prefix install-appdir

          # Bundle dependencies with sharun
          sharun lib4bin \
            --hard-links \
            --with-hooks \
            --dst-dir install-appdir \
            install-appdir/bin/* "$QT_PLUGIN_PATH"/*/*.so

          # Copy AppImageUpdate for delta updates
          cp ~/bin/AppImageUpdate.AppImage install-appdir/bin/

          # Remove gamemode (not portable with DBus)
          find install-appdir -name '*gamemode*' -exec rm {} +

          # Setup AppImage environment
          echo "PRISMLAUNCHER_DISABLE_GLVULKAN=1" >> install-appdir/.env
          echo "QT_QPA_PLATFORMTHEME=xdgdesktopportal" >> install-appdir/.env
          ln -s share/applications/org.unmojang.FjordLauncher.desktop install-appdir/org.unmojang.FjordLauncher.desktop
          ln -s share/icons/hicolor/256x256/apps/org.unmojang.FjordLauncher.png install-appdir/org.unmojang.FjordLauncher.png
          ln -s org.unmojang.FjordLauncher.metainfo.xml install-appdir/share/metainfo/org.unmojang.FjordLauncher.appdata.xml 2>/dev/null || true
          mv install-appdir/sharun install-appdir/AppRun

          # Create AppImage
          VERSION="${{ needs.check-update.outputs.upstream_tag }}"
          mkappimage \
            --updateinformation "gh-releases-zsync|lzc256|build|latest|fjordlauncher-Linux-x86_64.AppImage.zsync" \
            install-appdir \
            fjordlauncher-${VERSION}-Linux-x86_64.AppImage

      - name: Package RPM (Linux)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          cd fjordlauncher-src
          VERSION="${{ needs.check-update.outputs.upstream_tag }}"

          # Create RPM build directories
          mkdir -p rpm-build/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Install to a temp directory
          cmake --install build --config "$BUILD_TYPE" --prefix rpm-build/root

          # Create spec file with absolute paths
          ROOT_DIR="$(pwd)/rpm-build/root"
          cat > rpm-build/SPECS/fjordlauncher.spec << EOF
          Name:           fjordlauncher
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        FjordLauncher - A custom Minecraft launcher

          License:        GPL-3.0
          URL:            https://github.com/unmojang/FjordLauncher

          %description
          FjordLauncher is a custom, open source Minecraft launcher.

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}/usr
          cp -a ${ROOT_DIR}/* %{buildroot}/usr/

          %files
          %defattr(-,root,root,-)
          /usr/*
          EOF

          # Build RPM
          rpmbuild --define "_topdir $(pwd)/rpm-build" -bb rpm-build/SPECS/fjordlauncher.spec

          # Copy to source directory with proper name
          cp rpm-build/RPMS/x86_64/*.rpm fjordlauncher-${VERSION}-Linux-x86_64.rpm

      - name: Upload artifact (Linux AppImage)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}-Linux-x86_64-AppImage
          path: fjordlauncher-src/fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}-Linux-x86_64.AppImage
          retention-days: 30

      - name: Upload artifact (Linux RPM)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}-Linux-x86_64-RPM
          path: fjordlauncher-src/fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}-Linux-x86_64.rpm
          retention-days: 30

      - name: Package (macOS)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'macOS'
        run: |
          cd fjordlauncher-src
          cmake --install build --config "$BUILD_TYPE" --prefix install
          cd install
          zip -r ../fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}-macOS-arm64.zip .

      - name: Upload artifact (macOS)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}-macOS-arm64
          path: fjordlauncher-src/fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}-macOS-arm64.zip
          retention-days: 30

      - name: Package (Windows)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd fjordlauncher-src
          cmake --install build --config "$BUILD_TYPE" --prefix install
          Compress-Archive -Path install/* -DestinationPath fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}-Windows-MSVC-x86_64.zip

      - name: Upload artifact (Windows)
        if: steps.check-enabled.outputs.enabled == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}-Windows-MSVC-x86_64
          path: fjordlauncher-src/fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}-Windows-MSVC-x86_64.zip
          retention-days: 30

      - name: Summary
        if: steps.check-enabled.outputs.enabled == 'true'
        run: |
          echo "## FjordLauncher Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Upstream Tag | \`${{ needs.check-update.outputs.upstream_tag }}\` |"
          echo "| Upstream SHA | \`${{ needs.check-update.outputs.upstream_sha }}\` |"
          echo "| Platform | ${{ matrix.artifact-name }} |"
          echo "| Qt Version | ${{ matrix.qt-version }} |"

  create-release:
    needs: [check-update, build]
    if: |
      needs.check-update.outputs.should_build == 'true' &&
      (github.event.inputs.create_release != 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -ls

      - name: Prepare release assets
        id: prepare
        run: |
          VERSION="${{ needs.check-update.outputs.upstream_tag }}"
          mkdir -p release-assets

          # Move and rename artifacts
          count=0
          for f in artifacts/*/*; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              cp "$f" "release-assets/$base"
              count=$((count + 1))
            fi
          done

          echo "Prepared $count release assets"
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}
          name: FjordLauncher ${{ needs.check-update.outputs.upstream_tag }}
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## Release Created"
          echo "Release: fjordlauncher-${{ needs.check-update.outputs.upstream_tag }}"
          echo "Assets uploaded: $(ls release-assets/ | wc -l)"

