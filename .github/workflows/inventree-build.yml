name: InvenTree

on:
  schedule:
    - cron: '56 18 * * *'  # Check once daily at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
    inputs:
      no_s3:
        description: 'Remove S3/SAML/gRPC dependencies (smaller image)'
        required: false
        default: true
        type: boolean
  push:
    paths:
      - 'inventree/**'
      - '.github/workflows/inventree-build.yml'
      - 'scripts/common.sh'

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: inventree/InvenTree
  UPSTREAM_REF: master

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get upstream commit and version
        id: commit
        run: |
          # Get latest commit from upstream
          COMMIT=$(curl -s "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/commits/${{ env.UPSTREAM_REF }}" | jq -r '.sha')
          if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
            echo "Failed to get upstream commit"
            exit 1
          fi
          SHORT_COMMIT=$(echo "$COMMIT" | cut -c1-7)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "short_commit=$SHORT_COMMIT" >> $GITHUB_OUTPUT
          echo "combined_key=inventree-${SHORT_COMMIT}" >> $GITHUB_OUTPUT
          echo "Upstream commit: $COMMIT"

      - name: Get version from latest release
        id: version
        run: |
          # Get latest release version
          VERSION=$(curl -s "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest" | jq -r '.tag_name' | sed 's/^v//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            # Fallback to commit short hash if no release
            VERSION="${{ steps.commit.outputs.short_commit }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Cache check
        if: github.event_name != 'push'
        id: cache
        uses: actions/cache@v4
        with:
          path: .build_success
          key: ${{ steps.commit.outputs.combined_key }}

      - name: Compare
        id: compare
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push triggered. Building."
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ -f .build_success ]; then
            echo "No updates detected. Skipping."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Updates detected. Proceeding to build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "done" > .build_success
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Clone InvenTree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          path: inventree-src
          ref: ${{ env.UPSTREAM_REF }}

      - name: Apply patches
        run: |
          source scripts/common.sh
          # Remove S3/SAML/gRPC dependencies by default
          export SLIM_NO_S3=${{ inputs.no_s3 || '1' }}
          apply_all_patches inventree inventree-src

      - name: Show patched Dockerfile diff
        run: |
          echo "=== Dockerfile Changes ==="
          git -C inventree-src diff contrib/container/Dockerfile | head -100
          echo ""
          echo "=== Requirements Changes ==="
          git -C inventree-src diff contrib/container/requirements.txt | head -50

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: inventree-src
          file: inventree-src/contrib/container/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:inventree
            ${{ env.REGISTRY }}/${{ github.repository }}:inventree-${{ needs.check-update.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## InvenTree Build Summary"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Upstream Commit | \`${{ needs.check-update.outputs.commit }}\` |"
          echo "| Version | \`${{ needs.check-update.outputs.version }}\` |"
          echo "| Image | \`${{ env.REGISTRY }}/${{ github.repository }}:inventree\` |"
          echo "| Removed | postgresql-client, mariadb-client, weasyprint, fonts-noto-cjk, libldap2 |"