name: Fcitx5-Android - Build (fcitx5-sync)

on:
  schedule:
    - cron: '56 18 */5 * *'  # Every 5 days at 02:56 Beijing time (18:56 UTC)
  workflow_dispatch:
    inputs:
      fcitx5_android_ref:
        description: 'fcitx5-android branch/tag/commit. Leave empty to use latest master.'
        required: false
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
  push:
    paths:
      - 'fcitx5-android/**'
      - '.github/workflows/fcitx5-android-build.yml'
      - 'scripts/common.sh'

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      cache_key: ${{ steps.check.outputs.cache_key }}
      upstream_sha: ${{ steps.hashes.outputs.upstream_sha }}
      sync_sha: ${{ steps.hashes.outputs.sync_sha }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Get Latest Hashes
        id: hashes
        run: |
          UPSTREAM_SHA=$(curl -s https://api.github.com/repos/fcitx5-android/fcitx5-android/commits/master | jq -r .sha)
          SYNC_SHA=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_PAT }}" https://api.github.com/repos/lzc256/fcitx5-sync/commits/master | jq -r .sha)
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "sync_sha=$SYNC_SHA" >> $GITHUB_OUTPUT

      - name: Check if build needed
        id: check
        uses: ./.github/workflows/utils/check-update
        with:
          cache_key: fcitx5-android-v1-${{ steps.hashes.outputs.upstream_sha }}-${{ steps.hashes.outputs.sync_sha }}-${{ github.sha }}

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch framework
        uses: actions/checkout@v4

      - name: Checkout fcitx5-sync (Go core for gomobile)
        uses: actions/checkout@v4
        with:
          repository: lzc256/fcitx5-sync
          ref: master
          path: fcitx5-sync
          token: ${{ secrets.GH_PAT }}

      - name: Clone fcitx5-android (with native submodules)
        uses: actions/checkout@v4
        with:
          repository: fcitx5-android/fcitx5-android
          ref: ${{ github.event.inputs.fcitx5_android_ref || github.event.inputs.upstream_tag || needs.check-update.outputs.upstream_sha }}
          submodules: recursive
          path: fcitx5-android-src

      - name: Apply patches
        run: |
          source scripts/common.sh
          apply_all_patches fcitx5-android fcitx5-android-src

      - name: Show patched files
        run: git -C fcitx5-android-src status --short

      - name: Install system deps (ECM/gettext, 照上游 CI)
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext
          sdkmanager --install "cmake;3.31.6" >/dev/null || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup NDK (r28, 与上游 build-logic Versions.defaultNDK = 28.0.13004108 一致)
        id: ndk
        run: |
          if [ ! -d "$HOME/ndk-r28" ]; then
            curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28-linux.zip
            unzip -q /tmp/ndk.zip -d $HOME
            mv $HOME/android-ndk-r28 $HOME/ndk-r28
            rm /tmp/ndk.zip
          fi
          echo "ndk-path=$HOME/ndk-r28" >> $GITHUB_OUTPUT

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          # gomobile bind 要求 go.mod 有 tool 指令（Go 1.24+ gomobile 检查）
          cd fcitx5-sync/core
          go get -tool golang.org/x/mobile/cmd/gobind@latest || true
          go mod tidy

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-fcitx5-android-${{ hashFiles('fcitx5-android-src/gradle/libs.versions.toml') }}
          restore-keys: gradle-fcitx5-android-

      - name: Resolve signing config
        id: sign
        env:
          KS_B64: ${{ secrets.FCITX5_ANDROID_KEYSTORE_BASE64 }}
          KS_PWD: ${{ secrets.FCITX5_ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.FCITX5_ANDROID_KEY_ALIAS }}
        run: |
          # 三个 secret 齐全才启用签名；缺任何一个都只构建 unsigned，
          # 否则上游 build-logic 会创建空的 signingConfig 并在
          # validateSigningRelease 阶段失败（Keystore file not set）。
          if [ -n "$KS_B64" ] && [ -n "$KS_PWD" ] && [ -n "$KS_ALIAS" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "Signing enabled (fcitx5-sync keystore)"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::FCITX5_ANDROID_KEYSTORE_* incomplete (need BASE64+PASSWORD+ALIAS). Building UNSIGNED APKs; sign them locally with apksigner."
          fi

      - name: Build release APKs
        working-directory: fcitx5-android-src
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          FCITX5_SYNC_CORE_DIR: ${{ github.workspace }}/fcitx5-sync/core
          # 只构建 arm64-v8a（上游 splits.abi 会据 BUILD_ABI 只出一个 split，
          # isUniversalApk=false 故不会额外产出 universal 包）
          BUILD_ABI: arm64-v8a
          SIGN_KEY_BASE64: ${{ steps.sign.outputs.enabled == 'true' && secrets.FCITX5_ANDROID_KEYSTORE_BASE64 || '' }}
          SIGN_KEY_PWD: ${{ steps.sign.outputs.enabled == 'true' && secrets.FCITX5_ANDROID_KEYSTORE_PASSWORD || '' }}
          SIGN_KEY_ALIAS: ${{ steps.sign.outputs.enabled == 'true' && secrets.FCITX5_ANDROID_KEY_ALIAS || '' }}
        run: |
          ./gradlew :app:assembleRelease :plugin:rime:assembleRelease :plugin:sync:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs (per-module dirs, arm64-v8a only)
        run: |
          rm -rf apks && mkdir -p apks/main apks/plugin-rime apks/plugin-sync
          cp fcitx5-android-src/app/build/outputs/apk/release/*.apk apks/main/ 2>/dev/null || true
          cp fcitx5-android-src/plugin/rime/build/outputs/apk/release/*.apk apks/plugin-rime/ 2>/dev/null || true
          cp fcitx5-android-src/plugin/sync/build/outputs/apk/release/*.apk apks/plugin-sync/ 2>/dev/null || true
          # 兜底校验：不应出现 universal / 其他 ABI 的包
          if ls apks/main/*.apk 2>/dev/null | grep -vq 'arm64-v8a'; then
            echo "::error::main APK 不是 arm64-v8a split"; ls -la apks/main; exit 1
          fi
          for d in apks/*/; do echo "== $d"; ls -la "$d"; done

      - name: Upload main APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-android-main-arm64-v8a
          path: apks/main/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload rime plugin APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-android-plugin-rime-arm64-v8a
          path: apks/plugin-rime/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload sync plugin APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-android-plugin-sync-arm64-v8a
          path: apks/plugin-sync/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create release
        if: github.event_name != 'push' && inputs.create_release != false && github.event_name == 'workflow_dispatch' && inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fcitx5-android-${{ needs.check-update.outputs.upstream_sha }}
          name: fcitx5-android ${{ needs.check-update.outputs.upstream_sha }}
          files: apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit successful build
        if: success()
        uses: ./.github/workflows/utils/commit-successful-update
        with:
          cache_key: fcitx5-android-v1-${{ needs.check-update.outputs.upstream_sha }}-${{ github.sha }}
